[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "concept-art-generator"
version = "0.1.0"
description = "Human-supervised, game-isolated concept art workflows."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "gradio>=6.0,<7",
  "openai>=1.0,<3",
  "pillow>=12.1,<13",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.8"]

[project.scripts]
concept-art = "concept_art_generator.cli:main"
concept-art-ui = "concept_art_generator.web:main"

[tool.hatch.build.targets.wheel]
packages = ["src/concept_art_generator"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
# FastAPI's declarative Form/File defaults are the supported framework pattern.
"src/concept_art_generator/web.py" = ["B008"]
# Gradio injects its progress tracker by inspecting a `gr.Progress()` default argument.
"src/concept_art_generator/ui.py" = ["B008"]
